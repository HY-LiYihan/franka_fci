[project]
name = "franka-fci"
version = "0.1.0"
description = "LAN-supervised control service for a Franka FR3 using pylibfranka."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pylibfranka==0.21.2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "numpy>=1.24,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
